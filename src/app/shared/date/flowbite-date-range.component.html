<div
  #host
  class="flex flex-wrap items-end gap-4"
  date-rangepicker
>
  <div>
    <label
      for="filter-range-from"
      class="mb-1 block text-sm font-medium text-heading"
    >
      Desde
    </label>
    <input
      id="filter-range-from"
      type="text"
      autocomplete="off"
      placeholder="Seleccionar fecha"
      class="block w-full min-w-40 rounded-base border border-default bg-neutral-primary-soft px-3 py-2 text-sm text-body focus:border-brand focus:ring-brand"
    />
  </div>
  <span class="hidden pb-2 text-sm text-body sm:inline" aria-hidden="true">a</span>
  <div>
    <label
      for="filter-range-to"
      class="mb-1 block text-sm font-medium text-heading"
    >
      Hasta
    </label>
    <input
      id="filter-range-to"
      type="text"
      autocomplete="off"
      placeholder="Seleccionar fecha"
      class="block w-full min-w-40 rounded-base border border-default bg-neutral-primary-soft px-3 py-2 text-sm text-body focus:border-brand focus:ring-brand"
    />
  </div>
</div>
