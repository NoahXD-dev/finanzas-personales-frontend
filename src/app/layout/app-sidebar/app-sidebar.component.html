<aside
  flowbiteSidebar
  [open]="true"
  class="relative z-0 flex h-full shrink-0 flex-col"
>
  <div flowbiteSidebarContent class="flex flex-1 flex-col">
    <ul class="flex-1">
      <li>
        <a
          flowbiteSidebarItem
          routerLink="/dashboard"
          routerLinkActive="bg-neutral-primary-soft"
        >
          <flowbite-icon name="chartPie" class="size-5 mr-2" />
          Dashboard
        </a>
      </li>

      <li>
        <a
          flowbiteSidebarItem
          routerLink="/movements"
          routerLinkActive="bg-neutral-primary-soft"
        >
          <flowbite-icon name="wallet" class="size-5 mr-2" />
          Movimientos
        </a>
      </li>
    </ul>

    <div class="mt-auto border-t border-default px-4 py-4">
      @if (user(); as currentUser) {
        <p class="truncate text-sm font-medium text-heading">
          {{ currentUser.name }}
        </p>
        <p class="truncate text-xs text-body">{{ currentUser.email }}</p>
      }
      <button
        flowbiteButton
        type="button"
        color="default"
        [outline]="true"
        class="mt-3 w-full"
        (click)="logout()"
      >
        Cerrar sesión
      </button>
    </div>
  </div>
</aside>
